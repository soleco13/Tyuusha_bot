# Сборка программы «Тюша Печать» и выпуск новой версии.
# Как выпустить: поменять VERSION в agent/tyusha_print.py, закоммитить и отправить тег:
#   git tag agent-v1.2.0 && git push origin agent-v1.2.0
# GitHub соберёт TyushaPrint.exe, проверит его и опубликует релиз — установленные программы
# найдут новую версию сами (в течение нескольких часов или сразу по кнопке «Обновить сейчас» в панели).
name: Сборка «Тюша Печать»

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt "pyinstaller>=6.6"

      - name: Версия в коде совпадает с тегом
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (Select-String -Path agent/tyusha_print.py -Pattern '^VERSION = "(.+)"').Matches[0].Groups[1].Value
          if ("agent-v$v" -ne "${{ github.ref_name }}") { throw "В коде версия $v, а тег ${{ github.ref_name }} — поправьте VERSION" }

      - name: Сборка exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name TyushaPrint --icon agent/assets/icon.ico --add-data "agent/assets;assets" --paths .
          --distpath agent/dist --workpath agent/build agent/tyusha_print.py

      - name: Самопроверка exe
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Force $env:APPDATA | Out-Null
          Start-Process -FilePath agent/dist/TyushaPrint.exe -ArgumentList "--selftest" -Wait
          $r = Get-Content (Join-Path $env:APPDATA "TyushaPrint/selftest.json") -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "Самопроверка не прошла: $($r.error)" }
          Write-Host "Самопроверка: версия $($r.version), принтеров $($r.printers.Count)"

      - name: Контрольная сумма
        id: sha
        shell: pwsh
        run: |
          $h = (Get-FileHash agent/dist/TyushaPrint.exe -Algorithm SHA256).Hash.ToLower()
          "sha=$h" >> $env:GITHUB_OUTPUT

      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: TyushaPrint
          path: agent/dist/TyushaPrint.exe

      - name: Выпуск релиза
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Тюша Печать ${{ github.ref_name }}"
          files: agent/dist/TyushaPrint.exe
          body: |
            Программа «Тюша Печать» для компьютера с принтером.

            Новая установка: скачайте TyushaPrint.exe, запустите и введите код из панели («Принтеры → Подключить компьютер»).
            Уже установленные программы обновятся сами, когда принтер будет свободен.

            SHA256: ${{ steps.sha.outputs.sha }}
